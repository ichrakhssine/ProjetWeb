<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Facial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .camera-container {
            border: 3px solid #007bff;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            display: inline-block;
            margin: 0 auto;
        }
        .btn-custom {
            border-radius: 20px;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fas fa-camera me-2"></i>Reconnaissance Faciale</h4>
                    </div>
                    <div class="card-body text-center">
                        <!-- Instructions -->
                        <div class="alert alert-info mb-4">
                            <i class="fas fa-info-circle me-2"></i>
                            Pour utiliser la reconnaissance faciale, positionnez votre visage devant la caméra et cliquez sur "Capturer"
                        </div>
                        
                        <!-- Zone caméra -->
                        <div class="camera-container mb-4">
                            <video id="video" width="400" height="300" autoplay playsinline></video>
                            <canvas id="canvas" style="display: none;"></canvas>
                        </div>
                        
                        <div id="capturedPhoto" class="mb-3" style="display: none;">
                            <h6>Photo capturée :</h6>
                            <img id="photo" width="200" height="150" class="img-thumbnail rounded">
                        </div>
                        
                        <div class="btn-group mb-3">
                            <button id="captureBtn" class="btn btn-primary btn-custom">
                                <i class="fas fa-camera me-2"></i>Capturer
                            </button>
                            <button id="retryBtn" class="btn btn-secondary btn-custom" style="display: none;">
                                <i class="fas fa-redo me-2"></i>Réessayer
                            </button>
                        </div>
                        
                        <div id="result" class="mt-3"></div>
                        
                        <div class="mt-4 pt-3 border-top">
                            <a href="{{ url_for('auth.login_form') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-1"></i>Retour au login standard
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        class FaceLogin {
            constructor() {
                this.video = document.getElementById('video');
                this.canvas = document.getElementById('canvas');
                this.photo = document.getElementById('photo');
                this.captureBtn = document.getElementById('captureBtn');
                this.retryBtn = document.getElementById('retryBtn');
                this.capturedPhoto = document.getElementById('capturedPhoto');
                this.result = document.getElementById('result');
                
                this.stream = null;
                this.capturedImage = null;
                
                this.init();
            }
            
            async init() {
                try {
                    
                    this.stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            width: { ideal: 400 },
                            height: { ideal: 300 },
                            facingMode: 'user' 
                        } 
                    });
                    this.video.srcObject = this.stream;
                    
                    this.setupEventListeners();
                    this.showMessage('success', 'Caméra activée avec succès! Positionnez votre visage dans le cadre.');
                } catch (error) {
                    console.error('Erreur caméra:', error);
                    this.showMessage('danger', 'Erreur d\'accès à la caméra. Vérifiez les permissions.');
                }
            }
            
            setupEventListeners() {
                this.captureBtn.addEventListener('click', () => this.capture());
                this.retryBtn.addEventListener('click', () => this.retry());
            }
            
            capture() {
                
                const context = this.canvas.getContext('2d');
                this.canvas.width = this.video.videoWidth;
                this.canvas.height = this.video.videoHeight;
                context.drawImage(this.video, 0, 0, this.canvas.width, this.canvas.height);
                
                this.capturedImage = this.canvas.toDataURL('image/jpeg', 0.8);
                this.photo.src = this.capturedImage;
                
                this.capturedPhoto.style.display = 'block';
                this.retryBtn.style.display = 'inline-block';
                this.captureBtn.style.display = 'none';
                
                this.authenticate();
            }
            
             async authenticate() {
            this.showMessage('info', '<i class="fas fa-spinner fa-spin me-2"></i>Reconnaissance faciale en cours...');
            
            try {
                const response = await fetch('/auth/api/face/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        image: this.capturedImage
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    this.showMessage('success', `<i class="fas fa-check-circle me-2"></i>${data.message}`);
                    setTimeout(() => {
                        window.location.href = '/admin/dashboard';
                    }, 2000);
                } else {
                    this.showMessage('danger', `<i class="fas fa-exclamation-triangle me-2"></i>${data.error}`);
                }
            } catch (error) {
                console.error('Erreur authentification:', error);
                this.showMessage('danger', '<i class="fas fa-exclamation-triangle me-2"></i>Erreur de connexion au serveur');
            }
        }
            
            retry() {
                this.capturedPhoto.style.display = 'none';
                this.retryBtn.style.display = 'none';
                this.captureBtn.style.display = 'inline-block';
                this.result.innerHTML = '';
                this.showMessage('info', 'Prenez une nouvelle photo de votre visage');
            }
            
            showMessage(type, message) {
                const alertClass = {
                    'success': 'alert-success',
                    'danger': 'alert-danger', 
                    'info': 'alert-info',
                    'warning': 'alert-warning'
                }[type] || 'alert-info';
                
                this.result.innerHTML = `
                    <div class="alert ${alertClass} alert-dismissible fade show">
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
            }
            
            cleanup() {
                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.faceLogin = new FaceLogin();
        });

        window.addEventListener('beforeunload', () => {
            if (window.faceLogin) {
                window.faceLogin.cleanup();
            }
        });
    </script>
</body>
</html>
