<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enregistrement Facial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .camera-container {
            border: 3px solid #007bff;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            display: inline-block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Enregistrement Facial</h4>
                    </div>
                    <div class="card-body text-center">
                        <div class="alert alert-warning mb-4">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            Pour utiliser la reconnaissance faciale, vous devez d'abord enregistrer votre visage.
                        </div>
                        
                        <div class="camera-container mb-4">
                            <video id="video" width="400" height="300" autoplay playsinline></video>
                            <canvas id="canvas" style="display: none;"></canvas>
                        </div>
                        
                        <div id="capturedPhoto" class="mb-3" style="display: none;">
                            <h6>Photo capturée :</h6>
                            <img id="photo" width="200" height="150" class="img-thumbnail rounded">
                        </div>
                        
                        <div class="btn-group mb-3">
                            <button id="captureBtn" class="btn btn-primary">
                                <i class="fas fa-camera me-2"></i>Capturer et Enregistrer
                            </button>
                            <button id="retryBtn" class="btn btn-secondary" style="display: none;">
                                <i class="fas fa-redo me-2"></i>Réessayer
                            </button>
                        </div>
                        
                        <div id="result" class="mt-3"></div>
                        
                        <div class="mt-4 pt-3 border-top">
                            <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-1"></i>Retour à la gestion des utilisateurs
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class FaceRegister {
            constructor() {
                this.video = document.getElementById('video');
                this.canvas = document.getElementById('canvas');
                this.photo = document.getElementById('photo');
                this.captureBtn = document.getElementById('captureBtn');
                this.retryBtn = document.getElementById('retryBtn');
                this.capturedPhoto = document.getElementById('capturedPhoto');
                this.result = document.getElementById('result');
                
                this.stream = null;
                this.capturedImage = null;
                this.userId = this.getUserIdFromURL();  // Récupérer l'ID depuis l'URL
                
                this.init();
            }
            
            getUserIdFromURL() {
                // Récupérer l'ID utilisateur depuis les paramètres d'URL
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get('user_id') || '1';  // Valeur par défaut si non trouvé
            }
            
            async init() {
                try {
                    this.stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'user' } 
                    });
                    this.video.srcObject = this.stream;
                    this.setupEventListeners();
                    this.showMessage('info', `Enregistrement du visage pour l'utilisateur ID: ${this.userId}`);
                } catch (error) {
                    this.showMessage('danger', 'Erreur d\'accès à la caméra');
                }
            }
            
            setupEventListeners() {
                this.captureBtn.addEventListener('click', () => this.capture());
                this.retryBtn.addEventListener('click', () => this.retry());
            }
            
            capture() {
                const context = this.canvas.getContext('2d');
                this.canvas.width = this.video.videoWidth;
                this.canvas.height = this.video.videoHeight;
                context.drawImage(this.video, 0, 0, this.canvas.width, this.canvas.height);
                
                this.capturedImage = this.canvas.toDataURL('image/jpeg', 0.8);
                this.photo.src = this.capturedImage;
                
                this.capturedPhoto.style.display = 'block';
                this.retryBtn.style.display = 'inline-block';
                this.captureBtn.style.display = 'none';
                
                this.registerFace();
            }
            
            async registerFace() {
                this.showMessage('info', '<i class="fas fa-spinner fa-spin me-2"></i>Enregistrement en cours...');
                
                try {
                    const response = await fetch('/auth/api/face/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            user_id: this.userId,
                            image: this.capturedImage
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        this.showMessage('success', `<i class="fas fa-check-circle me-2"></i>${data.message}`);
                        setTimeout(() => {
                            window.location.href = '/admin/users';  
                        }, 2000);
                    } else {
                        this.showMessage('danger', `<i class="fas fa-exclamation-triangle me-2"></i>${data.error}`);
                    }
                } catch (error) {
                    this.showMessage('danger', 'Erreur d\'enregistrement');
                }
            }
            
            retry() {
                this.capturedPhoto.style.display = 'none';
                this.retryBtn.style.display = 'none';
                this.captureBtn.style.display = 'inline-block';
                this.result.innerHTML = '';
            }
            
            showMessage(type, message) {
                const alertClass = {
                    'success': 'alert-success',
                    'danger': 'alert-danger', 
                    'info': 'alert-info'
                }[type] || 'alert-info';
                
                this.result.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
            }
            
            cleanup() {
                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.faceRegister = new FaceRegister();
        });

        window.addEventListener('beforeunload', () => {
            if (window.faceRegister) {
                window.faceRegister.cleanup();
            }
        });
    </script>
</body>
</html>
